{% load fa_digits %}
{% if lot %}
    <span class="inline-flex align-middle ml-2 mb-1 w-fit items-center gap-1.5 rounded-full border border-amber-200/80 bg-gradient-to-r from-amber-50 via-white to-amber-100 px-3 py-1.5 text-[11px] font-black text-amber-800 shadow-sm shadow-amber-100/80 dark:border-amber-500/20 dark:from-amber-500/15 dark:via-zinc-900 dark:to-amber-400/10 dark:text-amber-200 whitespace-nowrap">
        <span class="material-symbols-outlined text-[13px] sm:text-[14px]">sell</span>
        <span class="text-[15px] sm:text-[16px] leading-none">{{ lot|fa_digits }}</span>
    </span>
    {% if title_class %}
        <span class="{{ title_class }}">{{ title|fa_digits }}</span>
    {% else %}
        <span class="inline align-middle">{{ title|fa_digits }}</span>
    {% endif %}
{% else %}
    {{ fallback_title|default:title|fa_digits }}
{% endif %}
