{% extends 'base.html' %}

{% block title %}فرم درخواست صدور شناسنامه{% endblock %}

{% block content %}
<section class="mx-auto max-w-4xl px-4 py-8">
    <div class="rounded-3xl border border-gray-200 bg-white p-6 shadow-sm dark:border-gray-800 dark:bg-gray-900 md:p-8">
        
        <div class="mb-8 border-b border-gray-100 pb-5 dark:border-gray-800">
            <h1 class="text-2xl font-bold text-gray-800 dark:text-white">
                فرم درخواست صدور شناسنامه
            </h1>
        </div>

        <form action="#" method="get" class="space-y-6">
            <div class="grid gap-5 md:grid-cols-2">
                
                <!-- نام و نام خانوادگی -->
                <div class="space-y-2 md:col-span-2">
                    <label for="full_name" class="block text-sm font-bold text-gray-700 dark:text-gray-300">نام و نام خانوادگی</label>
                    <input id="full_name" name="full_name" type="text"
                        style="background-color: #F3EBDD !important; border: 1.5px solid #D8C5A4 !important;"
                        class="h-12 w-full rounded-2xl px-4 text-sm text-gray-900 outline-none transition focus:ring-2 focus:ring-amber-600/20">
                </div>

                <!-- کد ملی -->
                <div class="space-y-2">
                    <label for="national_code" class="block text-sm font-bold text-gray-700 dark:text-gray-300">کد ملی</label>
                    <input id="national_code" name="national_code" type="text" inputmode="numeric"
                        style="background-color: #F3EBDD !important; border: 1.5px solid #D8C5A4 !important;"
                        class="h-12 w-full rounded-2xl px-4 text-sm text-gray-900 outline-none transition focus:ring-2 focus:ring-amber-600/20">
                </div>

                <!-- شماره تماس -->
                <div class="space-y-2">
                    <label for="phone_number" class="block text-sm font-bold text-gray-700 dark:text-gray-300">شماره تماس</label>
                    <input id="phone_number" name="phone_number" type="tel"
                        style="background-color: #F3EBDD !important; border: 1.5px solid #D8C5A4 !important;"
                        class="h-12 w-full rounded-2xl px-4 text-sm text-gray-900 outline-none transition focus:ring-2 focus:ring-amber-600/20">
                </div>

                <!-- ابعاد -->
                <div class="space-y-2">
                    <label for="dimensions" class="block text-sm font-bold text-gray-700 dark:text-gray-300">ابعاد</label>
                    <input id="dimensions" name="dimensions" type="text"
                        style="background-color: #F3EBDD !important; border: 1.5px solid #D8C5A4 !important;"
                        class="h-12 w-full rounded-2xl px-4 text-sm text-gray-900 outline-none transition focus:ring-2 focus:ring-amber-600/20">
                </div>

                <!-- وزن -->
                <div class="space-y-2">
                    <label for="weight" class="block text-sm font-bold text-gray-700 dark:text-gray-300">وزن</label>
                    <input id="weight" name="weight" type="text"
                        style="background-color: #F3EBDD !important; border: 1.5px solid #D8C5A4 !important;"
                        class="h-12 w-full rounded-2xl px-4 text-sm text-gray-900 outline-none transition focus:ring-2 focus:ring-amber-600/20">
                </div>

                <!-- تصاویر اثر -->
                <div class="space-y-2 md:col-span-2">
                    <label class="block text-sm font-bold text-gray-700 dark:text-gray-300">تصاویر اثر</label>
                    <label for="artwork_images"
                        style="background-color: #F3EBDD !important; border: 1.5px dashed #CDB48B !important;"
                        class="flex min-h-[110px] cursor-pointer flex-col items-center justify-center rounded-2xl p-4 text-center transition hover:opacity-90">
                        <span class="material-symbols-outlined text-3xl text-amber-800/70">add_photo_alternate</span>
                        <span class="mt-1 text-xs font-bold text-gray-700 dark:text-gray-300">انتخاب تصاویر</span>
                    </label>
                    <input id="artwork_images" name="artwork_images" type="file" multiple accept="image/*" class="hidden">
                </div>

                <!-- توضیح تصویر -->
                <div class="space-y-2 md:col-span-2">
                    <label for="image_description" class="block text-sm font-bold text-gray-700 dark:text-gray-300">توضیح تصویر</label>
                    <textarea id="image_description" name="image_description" rows="3"
                        style="background-color: #F3EBDD !important; border: 1.5px solid #D8C5A4 !important;"
                        class="w-full rounded-2xl p-4 text-sm text-gray-900 outline-none transition focus:ring-2 focus:ring-amber-600/20"></textarea>
                </div>

                <!-- توضیحات -->
                <div class="space-y-2 md:col-span-2">
                    <label for="description" class="block text-sm font-bold text-gray-700 dark:text-gray-300">توضیحات</label>
                    <textarea id="description" name="description" rows="4"
                        style="background-color: #F3EBDD !important; border: 1.5px solid #D8C5A4 !important;"
                        class="w-full rounded-2xl p-4 text-sm text-gray-900 outline-none transition focus:ring-2 focus:ring-amber-600/20"></textarea>
                </div>

                <!-- متن تعهدنامه -->
                <div class="space-y-2 md:col-span-2">
                    <label for="commitment_text" class="block text-sm font-bold text-gray-700 dark:text-gray-300">متن تعهدنامه</label>
                    <textarea id="commitment_text" name="commitment_text" rows="4"
                        style="background-color: #F3EBDD !important; border: 1.5px solid #D8C5A4 !important;"
                        class="w-full rounded-2xl p-4 text-sm text-gray-900 outline-none transition focus:ring-2 focus:ring-amber-600/20"></textarea>
                </div>

            </div>

            <div class="border-t border-gray-100 pt-6 text-left dark:border-gray-800">
                <button type="submit"
                    class="inline-flex h-12 w-full items-center justify-center rounded-xl bg-gray-900 px-8 text-sm font-bold text-white transition hover:bg-black sm:w-auto">
                    ثبت درخواست
                </button>
            </div>
        </form>
        
    </div>
</section>
{% endblock %}
